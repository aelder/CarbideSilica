<?xml version="1.0" encoding="UTF-8"?>
<!-- The icon of Carbide Silica for Linux. The macOS app has no icon file, so this icon is
     drawn from the design system of the app (linux/PORT.md, section 4): the black of the
     display, the corner marks of a display panel, and the chain pulse with staked and mined
     blocks in their colours and glows. package.sh makes the PNG sizes from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="glow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="40" fill="#030304"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="39.5" fill="none" stroke="#bfccbf" stroke-opacity="0.22" stroke-width="3"/>
  <g fill="none" stroke="#bfccbf" stroke-opacity="0.55" stroke-width="5" stroke-linecap="square">
    <path d="M42 60 V42 H60"/>
    <path d="M196 42 H214 V60"/>
    <path d="M214 196 V214 H196"/>
    <path d="M60 214 H42 V196"/>
  </g>
  <line x1="50" y1="178" x2="206" y2="178" stroke="#bfccbf" stroke-opacity="0.4" stroke-width="4"/>
  <g filter="url(#glow)" opacity="0.85">
    <rect x="58" y="110" width="18" height="68" fill="#8f4ddb"/>
    <rect x="90" y="138" width="18" height="40" fill="#ff801f"/>
    <rect x="122" y="76" width="18" height="102" fill="#8f4ddb"/>
    <rect x="154" y="124" width="18" height="54" fill="#8f4ddb"/>
    <rect x="186" y="96" width="18" height="82" fill="#ff801f"/>
  </g>
  <rect x="58" y="110" width="18" height="68" fill="#b8adcc"/>
  <rect x="90" y="138" width="18" height="40" fill="#bdab70"/>
  <rect x="122" y="76" width="18" height="102" fill="#b8adcc"/>
  <rect x="154" y="124" width="18" height="54" fill="#b8adcc"/>
  <rect x="186" y="96" width="18" height="82" fill="#bdab70"/>
</svg>
